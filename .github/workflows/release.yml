name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Fail fast when the tag and the app version disagree: the module repository compares
      # versionCode, so a stale or mismatched tag would publish an APK users cannot update to.
      - name: Validate version and tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: |
          set -euo pipefail
          version_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts)
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ -z "$version_code" ] || [ -z "$version_name" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "v${version_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version_name}; expected v${version_name}" >&2
            exit 1
          fi
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "module_tag=${version_code}-${version_name}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :spotlessCheck :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Verify signature and stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SportEditor-${GITHUB_REF_NAME}.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "dist/SportEditor-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-apk
          path: dist/*.apk

      # One body feeds both release channels: a curated .github/release-notes/<tag>.md when
      # present, otherwise GitHub's generated notes. Never let them drift apart.
      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-body.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq .body > release-body.md
          fi
          test -s release-body.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: dist/*.apk
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}

      # The in-app updater reads gythialy/SportEditor releases; LSPosed/Vector and
      # modules.lsposed.org read Xposed-Modules-Repo/<package>. Both channels must be published,
      # and the module repository release tag must be VersionCode-VersionName.
      - name: Publish to Xposed module repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          MODULE_REPO: Xposed-Modules-Repo/io.github.gythialy.sporteditor
          MODULE_TAG: ${{ steps.version.outputs.module_tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing XPOSED_REPO_TOKEN secret; see docs/release.md" >&2
            exit 1
          fi
          apk="dist/SportEditor-${GITHUB_REF_NAME}.apk"
          test -f "$apk"
          extra=()
          if [ "$PRERELEASE" = "true" ]; then
            extra+=(--prerelease)
          fi
          if gh release view "$MODULE_TAG" --repo "$MODULE_REPO" >/dev/null 2>&1; then
            gh release edit "$MODULE_TAG" --repo "$MODULE_REPO" \
              --title "$VERSION_NAME" --notes-file release-body.md
            gh release upload "$MODULE_TAG" "$apk" --repo "$MODULE_REPO" --clobber
          else
            gh release create "$MODULE_TAG" "$apk" --repo "$MODULE_REPO" \
              --title "$VERSION_NAME" --notes-file release-body.md "${extra[@]}"
          fi
          echo "Published ${MODULE_TAG} to ${MODULE_REPO}"
