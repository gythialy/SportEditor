<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="SportEditor — LSPosed 步数修改器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05261E"/>
      <stop offset="0.55" stop-color="#0A5C47"/>
      <stop offset="1" stop-color="#10A276"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7CE3B3" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#B9F6DA" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CE3B3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7CE3B3" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#03150F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="260" fill="url(#glow)"/>
  <circle cx="1210" cy="300" r="180" fill="#7CE3B3" opacity="0.05"/>

  <!-- step bars -->
  <g opacity="0.9">
    <rect x="1070" y="240" width="22" height="60" rx="11" fill="#FFFFFF" opacity="0.10"/>
    <rect x="1106" y="214" width="22" height="86" rx="11" fill="#FFFFFF" opacity="0.14"/>
    <rect x="1142" y="182" width="22" height="118" rx="11" fill="#FFFFFF" opacity="0.18"/>
    <rect x="1178" y="146" width="22" height="154" rx="11" fill="url(#bar)"/>
    <rect x="1214" y="120" width="22" height="180" rx="11" fill="#FFFFFF" opacity="0.10"/>
  </g>
  <text x="1042" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#B9F6DA" opacity="0.9">DAILY CAP</text>
  <text x="1038" y="108" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" opacity="0.92">80,000</text>

  <!-- icon -->
  <g filter="url(#shadow)">
    <rect x="64" y="96" width="128" height="128" rx="32" fill="#FFFFFF" opacity="0.10"/>
    <g transform="translate(80 112) scale(0.926)">
      <rect width="108" height="108" rx="24" fill="#0B7A5A"/>
      <g fill="#FFFFFF">
        <rect x="43" y="64" width="12" height="16" rx="4"/>
        <rect x="58" y="56" width="12" height="24" rx="4"/>
        <rect x="73" y="46" width="12" height="34" rx="4"/>
        <g transform="rotate(-18 36 36)">
          <rect x="30.5" y="31" width="11" height="20" rx="5.5"/>
          <circle cx="33" cy="26" r="2.3"/>
          <circle cx="37.3" cy="24.6" r="2.6"/>
          <circle cx="41.6" cy="25.6" r="2.3"/>
          <circle cx="45.2" cy="28.4" r="1.9"/>
        </g>
      </g>
    </g>
  </g>

  <!-- title -->
  <text x="232" y="158" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">SportEditor</text>
  <text x="234" y="198" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#CDEFE2">LSPosed 步数修改器 · Modern Xposed API</text>

  <!-- chips -->
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500">
    <rect x="234" y="224" width="214" height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
    <text x="250" y="246" fill="#E7FFF5">微信 / 支付宝 / QQ / 微博</text>
    <rect x="462" y="224" width="166" height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
    <text x="478" y="246" fill="#E7FFF5">Kotlin · Compose</text>
    <rect x="642" y="224" width="160" height="34" rx="17" fill="#7CE3B3" opacity="0.16"/>
    <text x="658" y="246" fill="#B9F6DA">libxposed API 102</text>
  </g>
</svg>
