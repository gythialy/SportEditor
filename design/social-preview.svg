<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SportEditor — set step counts for WeChat, Alipay, QQ and Weibo on LSPosed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F0C"/>
      <stop offset="1" stop-color="#111B15"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7EDCB2" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M0 590H1200" stroke="#263029" stroke-width="1"/>

  <!-- Brand -->
  <path d="M80 72H124" stroke="#7EDCB2" stroke-width="3"/>
  <text x="140" y="78" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#9FAEA5">LIVE CIRCUIT</text>
  <text x="600" y="78" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="1" text-anchor="end" fill="#9FAEA5">LSPosed / libxposed</text>
  <rect x="80" y="118" width="88" height="88" rx="22" fill="#0B7A5A"/>
  <g transform="translate(91 129) scale(0.815)" fill="#FFFFFF">
    <rect x="43" y="64" width="12" height="16" rx="4"/>
    <rect x="58" y="56" width="12" height="24" rx="4"/>
    <rect x="73" y="46" width="12" height="34" rx="4"/>
    <g transform="rotate(-18 36 36)">
      <rect x="30.5" y="31" width="11" height="20" rx="5.5"/>
      <circle cx="33" cy="26" r="2.3"/>
      <circle cx="37.3" cy="24.6" r="2.6"/>
      <circle cx="41.6" cy="25.6" r="2.3"/>
      <circle cx="45.2" cy="28.4" r="1.9"/>
    </g>
  </g>
  <text x="194" y="188" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="600" letter-spacing="0.5" fill="#F2F7F3">SportEditor</text>
  <text x="80" y="304" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="54" font-weight="600" fill="#E6EDE7">步数，由你设定。</text>
  <text x="82" y="354" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="26" font-weight="400" fill="#B3CCBC">为四款常用 App 设定步数读数</text>

  <!-- Instrument echo -->
  <path d="M80 500H600" stroke="#263029" stroke-width="1"/>
  <path d="M80 494V506 M210 494V506 M340 494V506 M470 494V506 M600 494V506" stroke="#67766C" stroke-width="1"/>
  <circle cx="470" cy="500" r="9" fill="none" stroke="#7EDCB2" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="470" cy="500" r="4" fill="#7EDCB2"/>
  <text x="82" y="562" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" font-weight="400" fill="#9FAEA5">LSPosed 模块 · Kotlin / Compose</text>
  <path d="M624 140V520" stroke="#263029" stroke-width="1"/>

  <!-- Reading and link panel -->
  <rect x="668" y="110" width="452" height="424" rx="24" fill="#0D1511" stroke="#263029" stroke-width="1"/>
  <path d="M680 126H696 M680 126V142 M1108 518H1092 M1108 518V502" fill="none" stroke="#7EDCB2" stroke-opacity="0.45" stroke-width="1.5"/>
