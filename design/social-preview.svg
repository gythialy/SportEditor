    <circle cx="827" cy="448" r="2.5"/>
    <circle cx="934" cy="448" r="2.5"/>
    <circle cx="1041" cy="448" r="2.5"/>
  </g>
  <g font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#E6EDE7">
