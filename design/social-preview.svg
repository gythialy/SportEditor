  <text x="702" y="310" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#9FAEA5">STEPS</text>
  <path d="M700 340H1088" stroke="#263029" stroke-width="1"/>
  <path d="M700 333V347 M797 333V347 M894 333V347 M991 333V347 M1088 333V347" stroke="#67766C" stroke-width="1"/>
  <circle cx="991" cy="340" r="10" fill="none" stroke="#7EDCB2" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="991" cy="340" r="4" fill="#7EDCB2"/>
  <path d="M700 370H1088" stroke="#263029" stroke-width="1"/>
  <text x="700" y="400" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#9FAEA5">LINKED APPS</text>
  <path d="M720 448H1041" stroke="#7EDCB2" stroke-opacity="0.55" stroke-width="1.5"/>
  <g fill="#0D1511" stroke="#7EDCB2" stroke-width="1.5">
    <circle cx="720" cy="448" r="7"/>
    <circle cx="827" cy="448" r="7"/>
    <circle cx="934" cy="448" r="7"/>
    <circle cx="1041" cy="448" r="7"/>
